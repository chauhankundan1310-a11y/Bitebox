    <h1>Customer Registration & Order form</h1>
    <form>
        <h3>Customer Information</h3>
            <div class="mb-3">
                <label for="fullname">Full Nmae: </label>
                <input type="text" id="fullname" name="fullname" required>
    
            </div>
            <div class="mb-3">
            
                <label for="emai">Email: </label>
                <input type="email" id="emai" name="emai" required>
            
            </div>
            <div class="mb-3">
    
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" required>
        
            </div>
            <div class="mb-3">
        
                <label for="phone">Phone Number: </label>
                <input type="tel" id="phone" name="phone" required>
            
            </div>
        <br>
        <h3>Order Information</h3>
        <table>
            <tr>

                <td><label for="Quantity" class="required">Quantity:</label></td>
                <td><input type="number" id="Quantity" name="Quantity" required></td>
            </tr>
            <tr>

                <td><label for="DeliveryDate" class="required">DeliveryDate:</label></td>
                <td><input type="date" id="DeliveryDate" name="DeliveryDate" required></td>
            </tr>
            <tr>
                <td><label for="food" class="required">Select Food:</label></td>
                <td>
                <select id="food" name="food" required>
                    <option value="Please choose an item"></option>
                    <option value="Pizza">Pizza</option>
                    <option value="Burger">Burger</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Deserts">Deserts</option>
                    <option value="Beverages">Beverages</option>

                </select>
                </td>
            </tr>
        </table>
        <h3>Payment Method</h3>
        <table>
            <tr>
                <td><label for="Payment" class="required">Select Payment Method</label></td>
                <td>
                    <input type="radio" id="creditcard" name="Payment" value="creditcard">
                    <label for="creditcard">creditcard</label>

                    <input type="radio" id="debitcard" name="Payment" value="debitcard">
                    <label for="debitcard">Debitcard</label>

                    <input type="radio" id="cash" name="Payment" value="cash">
                    <label for="cash">Cash</label>
                </td>
            </tr>
        </table>
        <h3>Extras</h3>
        <table>
            <td><label for="Extras">Select Extras:</label></td>
            <td>
                <input type="checkbox" id="chees" name="Extras" value="chees">
                <label for="chees">Extra chees</label>

                <input type="checkbox" id="sauce" name="Extras" value="sauce">
                <label for="sauce">Extra sauce</label>

                <input type="checkbox" id="toppings" name="Extras" value="toppings">
                <label for="toppings">Extra Toppings</label>
            </td>

        </table>
        <h3>Delivery Instraction</h3>
        <table>
            <tr>
        <td><label for="deliveryinstraction">Delivery Instraction</label></td>
        <td><textarea
        id="deliveryinstraction" name="deliveryinstraction" rows="4" cols="50"></textarea>
        </td>
        </tr>
        <tr>
            <td><input class="btn btn-primary" type="submit" value="Submit order"></td>
            <td><input class="btn btn-danger" type="reset" value="Reset order"></td>
        </tr>
        </table>
    </form>
